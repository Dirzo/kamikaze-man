<!doctype html>
<html lang="en">
<head>

<title>Crazy Weapon Man</title>
<style>
html,body{margin:0;min-height:100%;background:#05070c;color:#eaf2ff;font-family:system-ui,Segoe UI,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center}.boot b{font-size:22px;letter-spacing:.08em}.boot span{display:block;margin-top:8px;color:#8fa5bf;font-weight:700;font-size:12px}
</style>
</head>
<body><div class="boot" id="boot"><div><b>CRAZY WEAPON MAN</b><span id="bootText">Loading the entire irresponsible arsenal…</span></div></div>
<script>globalThis.__CWM_PACKED=[];</script>
<script src="/game/chunk-00.js?v=cwm100-web-20260913g"></script>
<script src="/game/chunk-01.js?v=cwm100-web-20260913g"></script>
<script src="/game/chunk-02.js?v=cwm100-web-20260913g"></script>
<script src="/game/chunk-03.js?v=cwm100-web-20260913g"></script>
<script src="/game/chunk-04.js?v=cwm100-web-20260913g"></script>
<script src="/game/chunk-05.js?v=cwm100-web-20260913g"></script>
<script src="/game/chunk-06.js?v=cwm100-web-20260913g"></script>
<script src="/game/chunk-07.js?v=cwm100-web-20260913g"></script>
<script src="/game/chunk-08.js?v=cwm100-web-20260913g"></script>
<script>
(async()=>{
  if(globalThis.__CWM_PACKED.length!==9)throw new Error('Game bundle incomplete: '+globalThis.__CWM_PACKED.length+'/9');
  let b64=globalThis.__CWM_PACKED.join('').replace(/\s/g,'');b64+='='.repeat((4-b64.length%4)%4);
  const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(bytes[0]!==0x1f||bytes[1]!==0x8b)throw new Error('Game bundle is not valid gzip data.');
  if(!('DecompressionStream' in globalThis))throw new Error('A current desktop browser is required.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();
  if(!html.includes('CRAZY WEAPON MAN')&&!html.includes('Crazy Weapon Man'))throw new Error('Decoded bundle did not contain the game.');
  const patches='<script src="/patch-version-v14.js?v=cwm-version-20260915a"><\/script>'+
    '<script src="/elemental-weapons-v13.js?v=cwm-elements-20260914a"><\/script>'+
    '<script src="/arsenal-expansion-v14.js?v=cwm-arsenal-expansion-20260915a"><\/script>'+
    '<script src="/arsenal-visual-v14.js?v=cwm-arsenal-visual-20260915a"><\/script>'+
    '<script src="/leaderboard-inspector.js?v=cwm-lbinspect-20260914a"><\/script>'+
    '<script src="/online-leaderboard.js?v=cwm-online-20260913d"><\/script>'+
    '<script src="/frenzy-visual-hotfix.js?v=cwm-frenzy-20260913a"><\/script>'+
    '<script src="/gameplay-clarity.js?v=cwm-clarity-20260914b"><\/script>'+
    '<script src="/clarity-hotfix.js?v=cwm-clarity-hotfix-20260914a"><\/script>'+
    '<script src="/graphics-overhaul-v12.js?v=cwm-gfx-20260914b"><\/script>'+
    '<script src="/leaderboard-browser-v2.js?v=cwm-lb-browser-20260914a"><\/script>'+
    '<script src="/combat-balance-v12.js?v=cwm-danger-20260914b"><\/script>'+
    '<script src="/leaderboard-selfcheck-v14.js?v=cwm-lbcheck-20260915a"><\/script>'+
    '<script src="/arsenal-selfcheck-v14.js?v=cwm-arsenal-check-20260915a"><\/script>';
  html=/<\/body>/i.test(html)?html.replace(/<\/body>/i,patches+'</body>'):html+patches;
  document.open();document.write(html);document.close();
})().catch(err=>{const el=document.getElementById('bootText');if(el)el.textContent='LOAD FAILED: '+err.message;console.error(err)});
</script></body></html>
