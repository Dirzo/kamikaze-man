<style>
html,body{margin:0;min-height:100%;background:#05070c;color:#eaf2ff;font-family:system-ui,Segoe UI,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.box{max-width:650px;padding:28px;border:1px solid #33445d;border-radius:20px;background:#0d1420;box-shadow:0 24px 80px #000}.title{font-size:clamp(34px,7vw,72px);font-weight:1000;line-height:.9}.sub{margin-top:15px;color:#9eb1c9;font-weight:700}.bar{height:8px;margin:22px auto 0;max-width:360px;border-radius:999px;overflow:hidden;background:#151f2e}.bar i{display:block;width:65%;height:100%;background:linear-gradient(90deg,#fff176,#69e8ff,#ff72d6);animation:p 1s infinite alternate}@keyframes p{to{transform:translateX(55%)}}
</style>

<body><div class="boot"><div class="box"><div class="title">CRAZY<br>WEAPON MAN</div><div class="sub" id="bootText">Compressing several workplace violations into your browser...</div><div class="bar"><i></i></div></div></div>
<script>globalThis.__CWM_PACKED=[];</script>
<script src="/game/chunk-00.js?v=cwm100-web-20260913e"></script>

<script>
(async()=>{
  if(globalThis.__CWM_PACKED.length!==13) throw new Error('Game bundle incomplete: loaded '+globalThis.__CWM_PACKED.length+' of 13 chunks.');
  const b64=globalThis.__CWM_PACKED.join('');
  if(!b64||b64.length%4!==0) throw new Error('Game bundle is malformed.');
  const bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(bytes[0]!==0x1f||bytes[1]!==0x8b) throw new Error('Game bundle is not valid gzip data.');
  if(!('DecompressionStream' in globalThis)) throw new Error('This browser needs DecompressionStream support. Please use a current Chrome, Edge, Firefox, or Safari.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  if(!html.includes('CRAZY WEAPON MAN')&&!html.includes('Crazy Weapon Man')) throw new Error('Game bundle decoded but did not contain the game.');
  document.open();document.write(html);document.close();
})().catch(err=>{const el=document.getElementById('bootText');if(el)el.textContent='LOAD FAILED: '+err.message;console.error(err)});
</script></body></html>
