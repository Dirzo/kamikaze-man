<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crazy Weapon Lady</title>
<style>
html,body{margin:0;min-height:100%;background:#05070c;color:#eaf2ff;font-family:system-ui,Segoe UI,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.box{width:min(620px,88vw);padding:30px;border:1px solid #33445d;border-radius:18px;background:linear-gradient(150deg,#0d1624,#090d14);box-shadow:0 24px 80px #000}.title{font-size:clamp(36px,6vw,68px);font-weight:1000;line-height:.88;letter-spacing:-.055em}.eyebrow{font:1000 10px/1 system-ui;letter-spacing:.24em;color:#72ecff;margin-bottom:12px}.sub{margin-top:16px;color:#9eb1c9;font-weight:750;line-height:1.45}.bar{height:6px;margin:22px auto 0;max-width:330px;border-radius:999px;overflow:hidden;background:#151f2e}.bar i{display:block;width:48%;height:100%;background:linear-gradient(90deg,#fff176,#69e8ff,#ff72d6);animation:p .8s ease-in-out infinite alternate}@keyframes p{to{transform:translateX(108%)}}
</style>
</head>
<body>
<div class="boot" id="outerBoot"><div class="box"><div class="eyebrow">DESKTOP · HEAVY BUILD</div><div class="title">CRAZY<br>WEAPON LADY</div><div class="sub" id="bootText">Loading the Heavy combat build…</div><div class="bar" id="bootBar"><i></i></div></div></div>
<script src="/cwl-native-transform-v2.js?v=cwl-native-heavy-20260915e"></script>
<script src="/cwl-director-transform-v1.js?v=cwl-director-20260915a"></script>
<script src="/cwl-combat-hook-transform-v1.js?v=cwl-combat-hooks-20260915d"></script>
<script>
(async()=>{
  const root=document.documentElement;
  const mobileUA=/Android|iPhone|iPod|iPad|Mobile|Silk|Kindle/i.test(navigator.userAgent||'');
  const tooNarrow=innerWidth<1000;
  if(mobileUA||tooNarrow){
    root.dataset.cwlDesktopOnly='blocked';
    document.getElementById('bootText').textContent='Mobile support is temporarily disabled while the desktop combat build is being rebuilt. Open Crazy Weapon Lady on a desktop browser at 1000px or wider.';
    document.getElementById('bootBar').style.display='none';
    return;
  }
  root.dataset.cwlDesktopOnly='pass';

  const loadScript=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=()=>resolve(src);s.onerror=()=>reject(new Error('Failed to load '+src));document.body.appendChild(s)});
  globalThis.__CWM_PACKED=[];
  for(let i=0;i<9;i++)await loadScript(`/game/chunk-${String(i).padStart(2,'0')}.js?v=cwm100-web-20260913g`);
  if(globalThis.__CWM_PACKED.length!==9)throw new Error('Game bundle incomplete: loaded '+globalThis.__CWM_PACKED.length+' of 9 chunks.');
  let b64=globalThis.__CWM_PACKED.join('').replace(/\s/g,'');
  if(!b64)throw new Error('Game bundle is empty.');
  b64+='='.repeat((4-(b64.length%4))%4);
  let bin;
  try{bin=atob(b64)}catch(_){throw new Error('Game bundle Base64 decode failed.');}
  const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(bytes.length<2||bytes[0]!==0x1f||bytes[1]!==0x8b)throw new Error('Game bundle is not valid gzip data.');
  if(!('DecompressionStream' in globalThis))throw new Error('This browser needs DecompressionStream support.');
  let html;
  try{const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));html=await new Response(stream).text()}
  catch(_){throw new Error('Game bundle decompression failed.');}
  if(!html.includes('CRAZY WEAPON MAN')&&!html.includes('Crazy Weapon Man'))throw new Error('Game bundle decoded but did not contain the game.');

  try{if(globalThis.CWL_NATIVE_TRANSFORM_V2?.transform)html=globalThis.CWL_NATIVE_TRANSFORM_V2.transform(html);else console.warn('CWL native Heavy transform unavailable')}catch(e){console.error('CWL native Heavy transform failed safely',e)}
  try{if(globalThis.CWL_DIRECTOR_TRANSFORM_V1?.transform)html=globalThis.CWL_DIRECTOR_TRANSFORM_V1.transform(html);else console.warn('CWL director transform unavailable')}catch(e){console.error('CWL director transform failed safely',e)}
  try{if(globalThis.CWL_COMBAT_HOOK_TRANSFORM_V1?.transform)html=globalThis.CWL_COMBAT_HOOK_TRANSFORM_V1.transform(html);else console.warn('CWL combat hook transform unavailable')}catch(e){console.error('CWL combat hook transform failed safely',e)}

  function bridge(needle,replacement,label){if(!html.includes(needle)){console.warn('CWL optional bridge unavailable:',label);return false}html=html.replace(needle,replacement);return true}
  const bgNeedle='function drawBg(){let z=Z[zoneI],g=X.createLinearGradient(0,0,0,H);';
  const bgBridge=`function drawBg(){if(globalThis.__CWM_RENDER_HOOK&&typeof globalThis.__CWM_RENDER_HOOK.drawBg==='function'){try{const handled=globalThis.__CWM_RENDER_HOOK.drawBg({X,W,H,G,zoneI,time,mapScene,platforms,Z,chaosEvent,terrainMode});if(handled)return}catch(e){console.warn('CWM render hook drawBg failed',e)}}let z=Z[zoneI],g=X.createLinearGradient(0,0,0,H);`;
  bridge(bgNeedle,bgBridge,'background renderer');
  const entityNeedle='for(const e of E)creature(e);drawP();drawQ();playerDraw();drawF();drawWeaponWorldFX();if(chroma>0)';
  const entityBridge=`for(const e of E){let __cwmHandled=false;if(globalThis.__CWM_RENDER_HOOK&&typeof globalThis.__CWM_RENDER_HOOK.drawEnemy==='function'){try{__cwmHandled=!!globalThis.__CWM_RENDER_HOOK.drawEnemy({X,W,H,G,zoneI,time,mapScene,platforms,Z,pl,e,d:ED[e.type],E,P,F,T,chaosEvent,terrainMode})}catch(__cwmErr){console.warn('CWM render hook enemy failed',__cwmErr)}}if(!__cwmHandled)creature(e)}drawP();drawQ();let __cwmPlayerHandled=false;if(globalThis.__CWM_RENDER_HOOK&&typeof globalThis.__CWM_RENDER_HOOK.drawPlayer==='function'){try{__cwmPlayerHandled=!!globalThis.__CWM_RENDER_HOOK.drawPlayer({X,W,H,G,zoneI,time,mapScene,platforms,Z,pl,E,P,F,T,w:curW(),dps:estimateDPS(curW()),rarity:rarityRank(curW()),chaosEvent,terrainMode})}catch(__cwmErr){console.warn('CWM render hook player failed',__cwmErr)}}if(!__cwmPlayerHandled)playerDraw();drawF();drawWeaponWorldFX();if(globalThis.__CWM_RENDER_HOOK&&typeof globalThis.__CWM_RENDER_HOOK.afterEntities==='function'){try{globalThis.__CWM_RENDER_HOOK.afterEntities({X,W,H,G,zoneI,time,mapScene,platforms,Z,pl,E,P,F,T,chaosEvent,terrainMode})}catch(e){console.warn('CWM render hook afterEntities failed',e)}}if(chroma>0)`;
  bridge(entityNeedle,entityBridge,'entity renderer');
  bridge('window.__KM_DEBUG={',"globalThis.__CWM_NATIVE_RENDER_BRIDGE='v3-clean-desktop';window.__KM_DEBUG={",'debug bridge');

  const prepaint=`<style id="cwlPrepaint">html.cwlBooting,html.cwlBooting body{background:#05070c!important}html.cwlBooting body>*:not(#cwlBootCover){visibility:hidden!important}#cwlBootCover{visibility:visible!important;position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#05070c;color:#eaf2ff;font-family:system-ui,Segoe UI,sans-serif}#cwlBootCover .inner{text-align:center}#cwlBootCover .k{font:1000 10px/1 system-ui;letter-spacing:.24em;color:#72ecff}#cwlBootCover .n{font:1000 clamp(38px,6vw,68px)/.88 system-ui;letter-spacing:-.055em;margin-top:11px}#cwlBootCover .s{font:800 12px/1.4 system-ui;color:#9eb1c9;margin-top:16px}</style><script>document.documentElement.classList.add('cwlBooting')<\/script>`;
  html=html.replace(/<head>/i,'<head>'+prepaint);
  html=html.replace(/<body([^>]*)>/i,'<body$1><div id="cwlBootCover"><div class="inner"><div class="k">DESKTOP · HEAVY BUILD</div><div class="n">CRAZY<br>WEAPON LADY</div><div class="s">Synchronizing Heavy combat and interface…</div></div></div>');

  const modules=[
    '/cwl-identity-v1.js?v=cwl-identity-20260915b',
    '/patch-version-v14.js?v=cwl-version-20260915a',
    '/elemental-weapons-v13.js?v=cwm-elements-20260914a',
    '/leaderboard-inspector.js?v=cwm-lbinspect-20260914a',
    '/online-leaderboard.js?v=cwm-online-20260913d',
    '/frenzy-visual-hotfix.js?v=cwm-frenzy-20260913a',
    '/graphics-overhaul-v12.js?v=cwm-gfx-20260914b',
    '/renderer-v2-sewer.js?v=cwm-v2-sewer-native-20260914b',
    '/entity-renderer-v2.js?v=cwm-v2-entities-20260914a',
    '/weapon-visual-system-v8.js?v=cwl-heavy-20260915b',
    '/heavy-artillery-v9.js?v=cwl-heavy-20260915b',
    '/heavy-base-lock-v10.js?v=cwl-heavy-20260915b',
    '/heavy-only-v10.js?v=cwl-heavy-native-20260915c',
    '/heavy-runtime-atlas-v10.js?v=cwl-heavy-runtime-20260915c',
    '/cwl-heavy-body-v1.js?v=cwl-heavy-procedural-20260915e',
    '/leaderboard-browser-v2.js?v=cwm-lb-browser-20260914a',
    '/combat-balance-v12.js?v=cwm-danger-20260914b',
    '/cwl-combat-presentation-v1.js?v=cwl-presentation-v2-20260915a',
    '/cwl-runtime-v1.js?v=cwl-runtime-20260915a',
    '/leaderboard-selfcheck-v14.js?v=cwl-lbcheck-20260915a',
    '/tester-shortcuts-v2.js?v=cwm-tester-heavy-20260915f',
    '/cwl-presentation-proof-v1.js?v=cwl-presentation-proof-20260915a',
    '/cwl-director-proof-v1.js?v=cwl-director-proof-20260915a'
  ];
  const onlinePatch=modules.map(src=>`<script src="${src}"><\/script>`).join('');
  const reveal=`<script>(()=>{const started=Date.now();const ready=()=>{const body=globalThis.CWL_HEAVY_BODY?.ready?.(),ui=!!globalThis.CWL_COMBAT_PRESENTATION,rt=globalThis.CWL_RUNTIME?.state?.ready;if((body&&ui&&rt)||Date.now()-started>3500){document.documentElement.classList.remove('cwlBooting');document.documentElement.dataset.cwlBoot='ready';document.getElementById('cwlBootCover')?.remove();clearInterval(timer)}};const timer=setInterval(ready,35);ready()})()<\/script>`;
  html=/<\/body>/i.test(html)?html.replace(/<\/body>/i,onlinePatch+reveal+'</body>'):html+onlinePatch+reveal;
  document.open();document.write(html);document.close();
})().catch(err=>{const el=document.getElementById('bootText');if(el)el.textContent='LOAD FAILED: '+err.message;const bar=document.getElementById('bootBar');if(bar)bar.style.display='none';console.error(err)});
</script>
</body>
</html>
