<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crazy Weapon Man — Next</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1428;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }
      @font-face {
        font-family: 'Noobscrub';
        src: url('/assets/fonts/noobscrub-5x7.woff2') format('woff2');
      }
      #bar {
        display: flex;
        align-self: stretch;
        justify-content: flex-end;
        padding: 0 8px;
        gap: 6px;
        z-index: 2;
      }
      #bar button {
        font-family: 'Noobscrub', monospace;
        font-size: 16px;
        color: #f4f1e8;
        background: #2b2442;
        border: 2px solid #1a1428;
        box-shadow: inset 0 0 0 2px #ffc15a;
        padding: 6px 10px 4px;
        cursor: pointer;
        text-transform: uppercase;
      }
      #bar button:hover {
        background: #3e3a5c;
        color: #ffc15a;
      }
      #bar button:active {
        background: #1a1428;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="b-sound" tabindex="-1">Sound: On</button>
      <button id="b-music" tabindex="-1">Music: On</button>
      <button id="b-pause" tabindex="-1">Pause</button>
      <button id="b-restart" tabindex="-1">Restart</button>
      <button id="b-full" tabindex="-1">Fullscreen</button>
    </div>
    <canvas id="screen" width="480" height="270"></canvas>
    <script type="module" src="/next/src/main.js"></script>
  </body>
</html>
