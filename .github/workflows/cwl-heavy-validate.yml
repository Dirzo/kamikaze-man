name: CWL Heavy Validation

on:
  push:
    branches:
      - crazy-weapon-man-web
    paths:
      - 'crazy-weapon-man-site/**'
      - '.github/workflows/cwl-heavy-validate.yml'
  workflow_dispatch:

concurrency:
  group: cwl-heavy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-heavy-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production packed bundle
        working-directory: crazy-weapon-man-site
        run: node scripts/validate-heavy.mjs
      - name: Headless desktop runtime smoke test
        working-directory: crazy-weapon-man-site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8788 --directory public >/tmp/cwl-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary found on runner"
            exit 1
          fi
          set +e
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,900 --autoplay-policy=no-user-gesture-required --virtual-time-budget=6500 --run-all-compositor-stages-before-draw --dump-dom 'http://127.0.0.1:8788/?cwlSmoke=1' >/tmp/cwl-dom.html 2>/tmp/cwl-chrome.log
          CHROME_RC=$?
          set -e
          if [ $CHROME_RC -ne 0 ]; then
            echo "Chrome exited with $CHROME_RC"
            cat /tmp/cwl-chrome.log
            exit $CHROME_RC
          fi
          proofs=(
            'data-cwl-desktop-only="pass"'
            'data-cwl-boot="ready"'
            'data-cwl-title-shell="ready"'
            'data-cwl-utility-shell="ready"'
            'data-cwl-title-lady="rendered"'
            'data-cwl-heavy-proof="pass"'
            'data-cwl-heavy-weapon="hammer"'
            'data-cwl-heavy-rolls="48/48"'
            'data-cwl-heavy-visuals="10/10"'
            'data-cwl-lady-render="pass"'
            'data-cwl-lady-priority="pass"'
            'data-cwl-native-combat="pass"'
            'data-cwl-hammer-swing-proof="pass"'
            'data-cwl-presentation="pass"'
            'data-cwl-presentation-desktop="yes"'
            'data-cwl-player-scale="1.26"'
            'data-cwl-compact-hud="ready"'
            'data-cwl-interface-source="native"'
            'data-cwl-legacy-hud="hidden"'
            'data-cwl-unified-interface="pass"'
            'data-cwl-boot-clean="pass"'
            'data-cwl-legacy-sprites="removed"'
            'data-cwl-director="pass"'
            'data-cwl-wave0-roles="1"'
            'data-cwl-wave1-roles="2"'
            'data-cwl-wave2-roles="3"'
            'data-cwl-wave1-mode="cross-training"'
            'data-cwl-enemy-variation="ready"'
            'data-cwl-enemy-variation-draw="pass"'
            'data-cwl-heavy-silhouette="ready"'
            'data-cwl-heavy-silhouette-draw="pass"'
            'data-cwl-heavy-impact="ready"'
            'data-cwl-heavy-impact-draw="pass"'
            'data-cwl-heavy-signatures-live="pass"'
            'data-cwl-heavy-specials-live="pass"'
            'data-cwl-slayer-live="pass"'
            'data-cwl-native-hooks="pass"'
            'data-cwl-hammer-swing="pass"'
            'data-cwl-browser-smoke="pass"'
            'data-cwl-combat-active="pass"'
            'data-cwl-combat-hud="pass"'
            'data-cwl-legacy-hud-proof="hidden"'
            'data-cwl-live-wave0-types="1"'
            'data-cwl-live-wave1-types="2"'
          )
          for proof in "${proofs[@]}"; do
            if ! grep -q "$proof" /tmp/cwl-dom.html; then
              echo "CWL runtime proof missing: $proof"
              grep -o 'data-cwl-[^ >]*' /tmp/cwl-dom.html | sort -u || true
              grep -o '<div id="cwlSmokeProof"[^>]*>[^<]*' /tmp/cwl-dom.html || true
              echo "--- Chrome stderr ---"
              tail -180 /tmp/cwl-chrome.log || true
              exit 1
            fi
          done
          grep -o 'data-cwl-title-shell="[^"]*"' /tmp/cwl-dom.html
          grep -o 'data-cwl-unified-interface="[^"]*"' /tmp/cwl-dom.html
          grep -o 'data-cwl-boot-clean="[^"]*"' /tmp/cwl-dom.html
          grep -o 'data-cwl-legacy-sprites="[^"]*"' /tmp/cwl-dom.html
          grep -o 'data-cwl-heavy-proof="[^"]*"' /tmp/cwl-dom.html
          grep -o 'data-cwl-hammer-angles="[^"]*"' /tmp/cwl-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,900 --autoplay-policy=no-user-gesture-required --virtual-time-budget=3000 --run-all-compositor-stages-before-draw --screenshot=/tmp/cwl-title.png 'http://127.0.0.1:8788/' >/tmp/cwl-title.log 2>&1
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,900 --autoplay-policy=no-user-gesture-required --virtual-time-budget=4200 --run-all-compositor-stages-before-draw --screenshot=/tmp/cwl-combat.png 'http://127.0.0.1:8788/?cwlSmoke=1' >/tmp/cwl-combat.log 2>&1
          test -s /tmp/cwl-title.png
          test -s /tmp/cwl-combat.png

      - name: Mobile is intentionally blocked
        working-directory: crazy-weapon-man-site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8789 --directory public >/tmp/cwl-mobile-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8789/ >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --user-agent="$UA" --virtual-time-budget=1200 --dump-dom 'http://127.0.0.1:8789/' >/tmp/cwl-mobile.html 2>/tmp/cwl-mobile-chrome.log
          grep -q 'data-cwl-desktop-only="blocked"' /tmp/cwl-mobile.html
          grep -q 'data-cwl-desktop-required="yes"' /tmp/cwl-mobile.html
          grep -q 'Crazy Weapon Lady is desktop-only' /tmp/cwl-mobile.html
          if grep -q 'id="gameStage"' /tmp/cwl-mobile.html; then
            echo 'Mobile unexpectedly booted the packed game'
            exit 1
          fi

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cwl-ui-qa
          path: |
            /tmp/cwl-title.png
            /tmp/cwl-combat.png
          retention-days: 3
