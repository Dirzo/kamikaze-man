name: Arsenal Validation

on:
  push:
    branches:
      - crazy-weapon-man-web
    paths:
      - 'crazy-weapon-man-site/**'
      - '.github/workflows/arsenal-validate.yml'
  workflow_dispatch:

concurrency:
  group: arsenal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-arsenal:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check arsenal modules
        run: |
          node --check crazy-weapon-man-site/public/arsenal-expansion-v14.js
          node --check crazy-weapon-man-site/public/arsenal-visual-v14.js
          node --check crazy-weapon-man-site/public/weapon-specials-v15.js
          node --check crazy-weapon-man-site/public/no-mana-compat-v17.js
          node --check crazy-weapon-man-site/public/horde-combat-v16.js
          node --check crazy-weapon-man-site/public/nightmare-director-v18.js
          node --check crazy-weapon-man-site/public/nightmare-mutants-v18.js
          node --check crazy-weapon-man-site/public/nightmare-balance-v18.js
          node --check crazy-weapon-man-site/public/elemental-overdrive-v16.js
          node --check crazy-weapon-man-site/public/horde-clarity-v16.js
          node --check crazy-weapon-man-site/public/horde-selfcheck-v16.js
          node --check crazy-weapon-man-site/public/combat-feedback-v17.js
          node --check crazy-weapon-man-site/public/feedback-clarity-v17.js
          node --check crazy-weapon-man-site/public/arsenal-selfcheck-v14.js
          node --check crazy-weapon-man-site/public/arsenal-presentation-v14.js
          node --check crazy-weapon-man-site/public/arsenal-hud-v16.js
          node --check crazy-weapon-man-site/public/arsenal-native-cleanup-v14.js
          node --check crazy-weapon-man-site/public/patch-version-v14.js
          node --check crazy-weapon-man-site/public/leaderboard-selfcheck-v14.js

      - name: Headless browser mixed-arsenal controls and horde proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8788 --directory crazy-weapon-man-site/public >/tmp/cwm-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8788/ >/dev/null && break
            sleep 0.2
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,900 --virtual-time-budget=9000 --dump-dom 'http://127.0.0.1:8788/?arsenalSmoke=1&hordeSmoke=1&rolls=2200' >/tmp/arsenal-dom.html 2>/tmp/chrome.log
          for proof in \
            'data-cwm-arsenal-proof="pass"' \
            'data-cwm-arsenal-types="9/9"' \
            'data-cwm-arsenal-new-elements="10/10"' \
            'data-cwm-arsenal-models="54"' \
            'data-cwm-heavy-only="no"' \
            'data-cwm-specials-proof="pass"' \
            'data-cwm-specials-types="9/9"' \
            'data-cwm-special-key="space"' \
            'data-cwm-mana-mechanic="off"' \
            'data-cwm-no-mana-legacy="pass"' \
            'data-cwm-a-combat-key="retired"' \
            'data-cwm-space-special="pass"' \
            'data-cwm-horde-proof="pass"' \
            'data-cwm-element-reaction-proof="pass"' \
            'data-cwm-element-families="10"' \
            'data-cwm-horde-cap="28"' \
            'data-cwm-projectile-cap="72"'; do
            if ! grep -q "$proof" /tmp/arsenal-dom.html; then
              echo "Missing proof: $proof"
              grep -o 'data-cwm-arsenal-[^ >]*' /tmp/arsenal-dom.html || true
              grep -o 'data-cwm-special[^ >]*' /tmp/arsenal-dom.html || true
              grep -o 'data-cwm-no-mana-legacy="[^"]*"' /tmp/arsenal-dom.html || true
              grep -o 'data-cwm-horde[^ >]*' /tmp/arsenal-dom.html || true
              grep -o 'data-cwm-element[^ >]*' /tmp/arsenal-dom.html || true
              grep -o 'data-cwm-projectile-cap="[^"]*"' /tmp/arsenal-dom.html || true
              tail -140 /tmp/chrome.log || true
              exit 1
            fi
          done
          HORDE_COUNT=$(grep -o 'data-cwm-horde-count="[0-9]*"' /tmp/arsenal-dom.html | head -1 | grep -o '[0-9]*')
          CROWD_HITS=$(grep -o 'data-cwm-horde-crowd-hits="[0-9]*"' /tmp/arsenal-dom.html | head -1 | grep -o '[0-9]*')
          test "${HORDE_COUNT:-0}" -ge 10
          test "${HORDE_COUNT:-99}" -le 28
          test "${CROWD_HITS:-0}" -ge 2
          if grep -q '>MANA<' /tmp/arsenal-dom.html; then
            echo 'Visible MANA label remains in HUD DOM'
            exit 1
          fi
          grep -q '>SPECIAL<' /tmp/arsenal-dom.html
          grep -q 'SPACE //' /tmp/arsenal-dom.html

      - name: Headless browser nightmare boss proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8791 --directory crazy-weapon-man-site/public >/tmp/cwm-nightmare-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          sleep 0.5
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          URL='http://127.0.0.1:8791/?nightmareSmoke=1'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,900 --virtual-time-budget=7000 --dump-dom "$URL" >/tmp/nightmare-dom.html 2>/tmp/nightmare-chrome.log
          for proof in \
            'data-cwm-nightmare-proof="pass"' \
            'data-cwm-nightmare-boss-sets="6"' \
            'data-cwm-nightmare-hazards="pass"' \
            'data-cwm-nightmare-prison="pass"' \
            'data-cwm-nightmare-boil="pass"' \
            'data-cwm-nightmare-laser="pass"' \
            'data-cwm-nightmare-whirl="pass"' \
            'data-cwm-nightmare-mutants="pass"'; do
            if ! grep -q "$proof" /tmp/nightmare-dom.html; then
              echo "Missing nightmare proof: $proof"
              grep -o 'data-cwm-nightmare-[^ >]*' /tmp/nightmare-dom.html || true
              tail -160 /tmp/nightmare-chrome.log || true
              exit 1
            fi
          done

      - name: Headless browser combat feedback proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8790 --directory crazy-weapon-man-site/public >/tmp/cwm-feedback-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          sleep 0.4
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,900 --virtual-time-budget=6500 --dump-dom 'http://127.0.0.1:8790/?feedbackSmoke=1' >/tmp/feedback-dom.html 2>/tmp/feedback-chrome.log
          grep -q 'data-cwm-feedback-proof="pass"' /tmp/feedback-dom.html
          CHAIN=$(grep -o 'data-cwm-feedback-kill-chain="[0-9]*"' /tmp/feedback-dom.html | head -1 | grep -o '[0-9]*')
          XP=$(grep -o 'data-cwm-feedback-xp-pulses="[0-9]*"' /tmp/feedback-dom.html | head -1 | grep -o '[0-9]*')
          LEVELS=$(grep -o 'data-cwm-feedback-levelups="[0-9]*"' /tmp/feedback-dom.html | head -1 | grep -o '[0-9]*')
          DROPS=$(grep -o 'data-cwm-feedback-drops="[0-9]*"' /tmp/feedback-dom.html | head -1 | grep -o '[0-9]*')
          CASCADE=$(grep -o 'data-cwm-feedback-cascade="[0-9]*"' /tmp/feedback-dom.html | head -1 | grep -o '[0-9]*')
          test "${CHAIN:-0}" -ge 5
          test "${XP:-0}" -ge 5
          test "${LEVELS:-0}" -ge 1
          test "${DROPS:-0}" -ge 1
          test "${CASCADE:-0}" -ge 1

      - name: Capture combat and nightmare showcases
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8789 --directory crazy-weapon-man-site/public >/tmp/cwm-showcase-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          sleep 0.5
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          HORDE_URL='http://127.0.0.1:8789/?hordeShowcase=1&feedbackShowcase=1'
          NIGHT_URL='http://127.0.0.1:8789/?nightmareShowcase=1'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,900 --virtual-time-budget=4800 --dump-dom "$HORDE_URL" >/tmp/showcase-dom.html 2>/tmp/showcase-dom-chrome.log
          grep -q 'data-cwm-horde-showcase="ready"' /tmp/showcase-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,900 --virtual-time-budget=5000 --screenshot=/tmp/arsenal-showcase.png "$HORDE_URL" 2>/tmp/showcase-chrome.log
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,900 --virtual-time-budget=3600 --screenshot=/tmp/nightmare-showcase.png "$NIGHT_URL" 2>/tmp/nightmare-showcase-chrome.log
          test -s /tmp/arsenal-showcase.png
          test -s /tmp/nightmare-showcase.png

      - name: Upload arsenal QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: arsenal-showcase
          path: |
            /tmp/arsenal-showcase.png
            /tmp/nightmare-showcase.png
          retention-days: 5
